<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Care finder</title>
<script>try { var t = localStorage.getItem("vf-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <div id="map" aria-label="Map of India. Click to choose a search point."></div>
  <button id="map-expand" class="map-expand" type="button">Expand map</button>
  <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize map and panel. Double-click to reset." tabindex="0">
    <span class="grip" aria-hidden="true"></span>
    <button id="map-toggle" class="map-toggle" type="button" hidden>&#10216; map</button>
  </div>
  <aside class="panel" id="panel">
    <div class="panel-scroll" id="panel-scroll">
      <header class="head">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm1 10.5h-2v-2.5H8.5V8H11V5.5h2V8h2.5v2H13v2.5Z"/></svg>
          </span>
          <div>
            <h1>Care finder</h1>
            <p class="sub">Nearby facilities for a medical service, with the quoted evidence behind each one.</p>
          </div>
        </div>
        <div class="head-actions">
          <button class="text-btn" id="how-btn" type="button">How this works</button>
          <button class="theme-btn" id="theme-btn" type="button" aria-label="Theme: auto"></button>
        </div>
      </header>

      <section class="search">
        <form id="need-form" class="hero">
          <label for="need" class="hero-label">What care do you need?</label>
          <div class="hero-box">
            <svg class="hero-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"/></svg>
            <input id="need" type="text" placeholder="e.g. my father needs a kidney machine" autocomplete="off">
            <button type="submit" class="btn primary">Find</button>
          </div>
          <div id="match-out" class="match" hidden aria-live="polite"></div>
        </form>

        <div class="field combo">
          <label for="svc-input">Service</label>
          <div class="select-wrap">
            <input id="svc-input" type="text" role="combobox" aria-expanded="false" aria-controls="svc-list" autocomplete="off" placeholder="Type to search services">
            <svg class="chev" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
          </div>
          <ul id="svc-list" class="combo-list" role="listbox" hidden></ul>
          <div id="svc-note" class="note" hidden></div>
        </div>

        <div class="field">
          <span class="field-label">Location</span>
          <div class="loc-row">
            <form id="pin-form" class="inline-form">
              <input id="pin" inputmode="numeric" maxlength="10" placeholder="PIN code, e.g. 411001" aria-label="PIN code">
              <button class="btn ghost" type="submit">Use</button>
            </form>
            <form id="place-form" class="inline-form">
              <input id="place" placeholder="Place, e.g. Udaipur" aria-label="Place name">
              <button class="btn ghost" type="submit">Use</button>
            </form>
          </div>
          <p class="hint"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 9l10 4-4 2-2 4-4-10Z M4 4l2 2"/></svg>Or click anywhere on the map to use that point.</p>
        </div>
        <div id="point-out" class="point" hidden></div>
        <div id="msg" class="msg" hidden></div>
      </section>

      <section id="results" class="results" aria-live="polite"></section>
    </div>

    <div id="drawer" class="drawer" aria-hidden="true"></div>
  </aside>
</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <button class="icon-btn close" id="modal-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <h2 id="modal-title">How this works</h2>
    <div id="modal-body"><div class="sk sk-line"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
